[package]
name = "slack-reacji-notifier"
version = "0.1.0"
edition = "2021"
authors = ["Takahiro Hirata <42209812+checche@users.noreply.github.com>"]
description = "Slack bot that notifies users when they receive reactions on their messages"
repository = "https://github.com/yaichi-tech/slack-reacji-notifier"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.7"
worker-macros = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
