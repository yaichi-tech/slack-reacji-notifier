name = "slack-reacji-notifier"
main = "build/index.js"
compatibility_date = "2025-10-16"

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# [vars]
# 絵文字登録通知先チャンネルID（#reacji-release など）
# EMOJI_NOTIFICATION_CHANNEL = "C0XXXXXXX"
# 本番環境では wrangler secret put EMOJI_NOTIFICATION_CHANNEL で設定
